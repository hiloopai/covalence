[package]
name = "covalence-kv-s3"
description = "A key-value store on S3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/covalence-kv-s3"
keywords = ["key-value", "kv", "storage", "s3"]
categories = ["database-implementations"]
publish = true

[dependencies]
aws-config = { version = "1.12", default-features = false, features = ["credentials-process", "rt-tokio", "sso"] }
aws-credential-types = "1.2"
aws-smithy-http-client = { version = "1.5", features = ["rustls-ring"] }
covalence-kv-trait.workspace = true
covalence-lib-data.workspace = true
covalence-lib-error.workspace = true
data-encoding = "2.11.1"
rusty-s3 = "0.10"
sha2.workspace = true
tokio = { version = "1", features = ["rt"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
url = "2"

[dev-dependencies]
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
pollster = "1.0.1"
s3s = "0.17"
s3s-fs = "0.17"
tempfile = "3"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
