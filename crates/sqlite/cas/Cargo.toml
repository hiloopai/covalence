[package]
name = "covalence-sqlite-cas"
description = "Read-only SQLite databases opened from a content-addressed store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/covalence-sqlite-cas"
keywords = ["sqlite", "vfs", "cas", "content-addressing", "cid"]
categories = ["database"]
publish = true

[dependencies]
blake3.workspace = true
covalence-cas-trait.workspace = true
covalence-lib-cid.workspace = true
covalence-lib-dasl.workspace = true
covalence-lib-data.workspace = true
covalence-lib-error.workspace = true
# `limits`: connections refuse `ATTACH`.
covalence-lib-sqlite = { workspace = true, features = ["limits"] }
sha1 = "0.11.0"
sha2.workspace = true
tempfile = "3.27.0"

[dev-dependencies]
covalence-cas-memory.workspace = true

# Measures the fetch, cache and verification policies: see its first lines.
[[bench]]
name = "policies"
harness = false

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
