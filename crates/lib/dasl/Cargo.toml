[package]
name = "covalence-lib-dasl"
description = "DASL values and the DRISL codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/covalence-lib-dasl"
keywords = ["dasl", "drisl", "cbor", "dag-cbor", "cid"]
categories = ["encoding", "parser-implementations"]
publish = true

[dependencies]
covalence-lib-cid.workspace = true
covalence-lib-data.workspace = true
covalence-lib-error.workspace = true
covalence-lib-serde = { workspace = true, optional = true }
data-encoding = { version = "2.11.1", optional = true }
serde_json = { version = "1.0.151", optional = true }

[features]
json = ["dep:covalence-lib-serde", "dep:data-encoding", "dep:serde_json"]

[dev-dependencies]
blake3.workspace = true
covalence-lib-dasl = { path = ".", features = ["json"] }
data-encoding = "2.11.1"
serde_json = "1.0.151"
sha2.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
