[package]
name = "covalence-lib-cid"
description = "Content identifiers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/covalence-lib-cid"
keywords = ["cid", "multiformats", "multihash", "content-addressing", "dasl"]
categories = ["encoding"]
publish = true

[features]
default = ["rand"]
# O256::random
rand = ["dep:covalence-lib-rand"]

[dependencies]
covalence-lib-data.workspace = true
covalence-lib-rand = { workspace = true, optional = true }
covalence-lib-error.workspace = true
blake3 = "1.8.7"
data-encoding = "2.11.1"
sha1 = "0.11.0"
sha2 = "0.11.0"
unsigned-varint = "0.8.0"

[dev-dependencies]
proptest = "1.11.0"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
