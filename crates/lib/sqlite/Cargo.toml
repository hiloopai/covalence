[package]
name = "covalence-lib-sqlite"
description = "SQLite for Covalence, built from source"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/covalence-lib-sqlite"
keywords = ["sqlite", "rusqlite"]
categories = ["database"]
publish = true

[features]
hooks = ["rusqlite/hooks"]
limits = ["rusqlite/limits"]

[dependencies]
covalence-lib-error.workspace = true
rusqlite = { version = "0.40.2", features = ["blob", "bundled", "functions"] }

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata.docs.rs]
all-features = true

# A copy of [workspace.lints]; keep in sync. Unsafe code is denied rather than
# forbidden so that the private `vfs::ffi` module, which implements SQLite's C
# callbacks, can allow it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
