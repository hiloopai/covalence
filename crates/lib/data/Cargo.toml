[package]
name = "covalence-lib-data"
description = "Shared byte buffers and containers for Covalence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/covalence-lib-data"
keywords = ["bytes", "containers"]
categories = ["data-structures"]
publish = true

[dependencies]
bytes = "1.12.1"
hashbrown = { version = "0.17.1", default-features = false }
indexmap = "2.14.2"
smallvec = "1.16.1"
smol_str = "0.3.6"
arrayvec = "0.7.8"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
