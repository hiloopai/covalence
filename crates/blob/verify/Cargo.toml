[package]
name = "covalence-blob-verify"
description = "Byte streams checked against an expected length and digest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/covalence-blob-verify"
keywords = ["checksum", "streaming", "sha256", "blake3", "integrity"]
categories = ["cryptography"]
publish = true

[features]
default = ["tokio"]
# `AsyncRead` and `AsyncWrite` for the reader and writer.
tokio = ["dep:tokio"]

[dependencies]
blake3.workspace = true
covalence-lib-cid.workspace = true
covalence-lib-error.workspace = true
sha2.workspace = true
tokio = { version = "1", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "time"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
