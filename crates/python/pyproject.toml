[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "covalence"
dynamic = ["version"]
description = "Python bindings for Covalence"
readme = "README.md"
license = "CC0-1.0 OR MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-CC0", "LICENSE-MIT"]
requires-python = ">=3.11"

[project.optional-dependencies]
s3-python = ["boto3>=1.43.112"]
gcs = ["google-cloud-storage>=3.0"]

[project.urls]
Repository = "https://github.com/hiloopai/covalence"
Documentation = "https://github.com/hiloopai/covalence/blob/main/crates/python/README.md"
Issues = "https://github.com/hiloopai/covalence/issues"

[tool.maturin]
python-source = "python"
module-name = "covalence._native"
features = ["extension-module"]
# The third-party licenses CI generates (about.toml); not in Git, so name it.
include = [{ path = "python/covalence/THIRD-PARTY-LICENSES.md", format = ["sdist", "wheel"] }]
