# cargo-about: the licenses of the Rust crates compiled into the Python package.
# CI writes them to python/covalence/THIRD-PARTY-LICENSES.md before building.
# A dependency under a license not listed here fails the build.
# Order is preference: a crate under "MIT OR Apache-2.0" is listed under
# Apache-2.0, whose text needs no project-specific copyright line.
accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The platforms the wheels are built for.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]

# The crate's own licenses, not the MIT license of its test fixtures.
[covalence-lib-dasl.clarify]
license = "CC0-1.0 OR MIT OR Apache-2.0"
[[covalence-lib-dasl.clarify.files]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "4a05c10d6a7fb370e4d144a7be60ba651fff6b443cef0bc483a7b5e8129a98b8"
[[covalence-lib-dasl.clarify.files]]
path = "LICENSE-APACHE"
license = "Apache-2.0"
checksum = "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"
[[covalence-lib-dasl.clarify.files]]
path = "LICENSE-CC0"
license = "CC0-1.0"
checksum = "a2010f343487d3f7618affe54f789f5487602331c0a8d03f49e9a7c547cf0499"

# MIT, but the published crates leave out the license file; take it from the
# repository at the published commit.
[base64-simd.clarify]
license = "MIT"
[[base64-simd.clarify.git]]
path = "LICENSE"
checksum = "71674605ec4c087fe9eb534e3e4f9e26eb2e4aabcd76a29fd156c6a844d44b3d"

[vsimd.clarify]
license = "MIT"
[[vsimd.clarify.git]]
path = "LICENSE"
