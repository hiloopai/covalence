[package]
name = "covalence-lean-kernel-checker"
description = "Replay built Lean modules in the kernel and share their receipts over S3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cov-kernel-checker"
path = "src/main.rs"

[dependencies]
blake3.workspace = true
covalence-cas-kv = { path = "../../cas/kv", default-features = false }
covalence-cas-prolly = { path = "../../cas/prolly" }
covalence-cas-sqlite.workspace = true
covalence-cas-trait.workspace = true
covalence-kv-s3.workspace = true
covalence-kv-trait.workspace = true
covalence-lib-cid.workspace = true
covalence-lib-cli.workspace = true
covalence-lib-dasl.workspace = true
covalence-lib-error = { workspace = true, features = ["fancy"] }
covalence-lib-serde.workspace = true
flate2 = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tar = "0.4"
tempfile = "3"

[lints]
workspace = true
