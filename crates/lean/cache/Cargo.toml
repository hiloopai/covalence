[package]
name = "covalence-lean-cache"
description = "Record and share verified Lake build artifacts over S3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cov-lake-cache"
path = "src/main.rs"

[features]
# Integration tests execute the real pinned Lean toolchain.
lake-tests = []

[[test]]
name = "lake"
required-features = ["lake-tests"]

[dependencies]
covalence-kv-s3.workspace = true
covalence-kv-trait.workspace = true
covalence-lib-cli.workspace = true
covalence-lib-data.workspace = true
covalence-lib-error = { workspace = true, features = ["fancy"] }
covalence-lib-serde.workspace = true
data-encoding = "2.11.1"
serde_json = "1"
sha2.workspace = true
tempfile = "3"

[dev-dependencies]
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
s3s = "0.17"
s3s-fs = "0.17"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }

[lints]
workspace = true
