name: Install the Lean kernel checker
description: Install a pinned public Covalence kernel checker without compiling Rust in proof CI.

inputs:
  revision:
    description: Full public Covalence commit used by the kernel-checker release.
    required: true
  sha256:
    description: SHA-256 of the Linux x86-64 release archive.
    required: true

outputs:
  identity:
    description: The release identity, `<revision>:<sha256>`, for keying results made by this binary.
    value: ${{ steps.install.outputs.identity }}

runs:
  using: composite
  steps:
    - name: Install the verified binary
      id: install
      shell: bash
      env:
        CHECKER_REVISION: ${{ inputs.revision }}
        CHECKER_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        [[ "$CHECKER_REVISION" =~ ^[0-9a-f]{40}$ ]]
        [[ "$CHECKER_SHA256" =~ ^[0-9a-f]{64}$ ]]
        [[ "$(uname -s)-$(uname -m)" == Linux-x86_64 ]]
        install_dir=$(mktemp -d "$RUNNER_TEMP/cov-kernel-checker-XXXXXXXX")
        archive="$install_dir/cov-kernel-checker.tar.gz"
        curl --fail --location --silent --show-error --proto '=https' \
          --connect-timeout 10 --max-time 60 \
          "https://github.com/hiloopai/covalence/releases/download/kernel-checker-$CHECKER_REVISION/cov-kernel-checker-x86_64-unknown-linux-gnu.tar.gz" \
          --output "$archive"
        echo "$CHECKER_SHA256  $archive" | sha256sum --check
        tar -xzf "$archive" -C "$install_dir"
        echo "$install_dir" >> "$GITHUB_PATH"
        echo "identity=$CHECKER_REVISION:$CHECKER_SHA256" >> "$GITHUB_OUTPUT"
