name: Docs

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions: {}

# All publishing runs share a queue: each replaces the whole Pages site.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: >-
      github.event_name != 'push' || github.ref == 'refs/heads/main' ||
      (github.repository_id == '1382624821' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # One site per repository. The internal site always includes both
        # branches; PRs and other manual runs build only their checked-out ref.
        ref: ${{ fromJSON(github.event_name != 'pull_request' && github.repository_id == '1382624821' && contains(fromJSON('["refs/heads/main", "refs/heads/develop"]'), github.ref) && '["main", "develop"]' || '[""]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ matrix.ref || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the Rust docs
        run: nix develop --no-update-lock-file --command ./bin/glu doc
      # rustdoc writes no workspace index without unstable flags, so list the
      # crates on a small root page. No generated files are committed to Git.
      - name: Assemble the site
        env:
          DOCS_REF: ${{ matrix.ref }}
        run: |
          destination="site${DOCS_REF:+/$DOCS_REF}"
          mkdir -p "$destination"
          cp -R target/doc "$destination/rust"
          rm -f "$destination/rust/.lock"
          source_sha="$(git rev-parse HEAD)"
          {
            echo '<!doctype html>'
            echo '<meta charset="utf-8">'
            echo '<title>Covalence docs</title>'
            echo '<h1>Covalence docs</h1>'
            echo "<p>Built from $source_sha.</p>"
            echo '<h2>Rust crates</h2>'
            echo '<ul>'
            for index in "$destination"/rust/*/index.html; do
              crate="$(basename "$(dirname "$index")")"
              echo "<li><a href=\"rust/$crate/\">$crate</a></li>"
            done
            echo '</ul>'
          } > "$destination/index.html"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-${{ matrix.ref || 'current' }}
          path: site
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    # Repository IDs prevent forks from publishing, and keep internal docs
    # out of the public site. PRs and manual runs on feature branches cannot
    # deploy, even when their docs build succeeds.
    if: >-
      github.event_name != 'pull_request' &&
      ((github.repository_id == '1419632160' && github.ref == 'refs/heads/main') ||
       (github.repository_id == '1382624821' &&
        contains(fromJSON('["refs/heads/main", "refs/heads/develop"]'), github.ref)))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docs-*
          merge-multiple: true
          path: site
      - name: Assemble the branch index
        if: github.repository_id == '1382624821'
        run: |
          test -f site/main/index.html
          test -f site/develop/index.html
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Covalence docs</title>
          <h1>Covalence docs</h1>
          <ul>
            <li><a href="develop/">develop</a></li>
            <li><a href="main/">main</a></li>
          </ul>
          HTML
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
