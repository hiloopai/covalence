name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check, build, and test
        run: nix develop --no-update-lock-file --command ./bin/glu ci
