name: Python wheels

on:
  push:
    branches: [main]
    # v<version> releases to GitHub, PyPI and crates.io (crates.yml);
    # python-v<version> only attaches the wheels to a GitHub release.
    tags: ["v*", "python-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The licenses of the Rust crates compiled into the package, which the wheels
  # and the sdist must carry. about.toml lists the accepted licenses; a new one
  # fails here.
  third-party-licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-about@0.9.0
      # cargo-about reads cargo metadata with the toolchain in rust-toolchain.toml.
      - name: Generate THIRD-PARTY-LICENSES.md
        run: >-
          cargo about generate --locked
          --manifest-path crates/python/Cargo.toml
          -c crates/python/about.toml
          -o THIRD-PARTY-LICENSES.md
          crates/python/about.md.hbs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.md
          if-no-files-found: error

  wheel:
    name: wheel (${{ matrix.platform }})
    needs: third-party-licenses
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64:2026.10.09-1@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64:2026.10.09-1@sha256:abd1230aa9e4058a74b89d27cd14ba18c0db036d7bfe6e6f219a29ea63c24eb6
          - platform: macos-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: crates/python/python/covalence
      # maturin-action silently falls back to the latest maturin when it cannot
      # resolve the pyproject pin, so pass the pin explicitly.
      - name: Read the maturin pin
        id: maturin
        run: >-
          python3 -I -c 'import sys, tomllib;
          (pin,) = tomllib.load(open(sys.argv[1], "rb"))["build-system"]["requires"];
          print("version=v" + pin.removeprefix("maturin=="))'
          crates/python/pyproject.toml >> "$GITHUB_OUTPUT"
      # The Rust toolchain comes from rust-toolchain.toml.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ steps.maturin.outputs.version }}
          manylinux: ${{ matrix.container && '2_28' || '' }}
          container: ${{ matrix.container }}
          args: --release --locked --manifest-path crates/python/Cargo.toml --out dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false
      # Install into clean venvs at the abi3 floor and a current Python, and run
      # the acceptance tests from outside the source tree.
      - name: Smoke-test the wheel
        working-directory: ${{ runner.temp }}
        env:
          DIST: ${{ github.workspace }}/dist
          TESTS: ${{ github.workspace }}/crates/python/tests
        run: |
          for python in 3.11 3.14; do
            uv venv --python "$python" --managed-python "venv-$python"
            uv pip install --python "venv-$python" --no-index --no-deps "$DIST"/*.whl
            "venv-$python/bin/python" -I -m unittest discover -v -s "$TESTS"
            PY="venv-$python/bin/python"; "$PY" -I -c 'import importlib.resources as r; assert r.files("covalence").joinpath("THIRD-PARTY-LICENSES.md").is_file(), "THIRD-PARTY-LICENSES.md missing"'
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: third-party-licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: crates/python/python/covalence
      - name: Read the maturin pin
        id: maturin
        run: >-
          python3 -I -c 'import sys, tomllib;
          (pin,) = tomllib.load(open(sys.argv[1], "rb"))["build-system"]["requires"];
          print("version=v" + pin.removeprefix("maturin=="))'
          crates/python/pyproject.toml >> "$GITHUB_OUTPUT"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ steps.maturin.outputs.version }}
          command: sdist
          args: --manifest-path crates/python/Cargo.toml --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # The sdist is the only install route on platforms without a wheel, so build
  # it from the archive alone, outside the checkout, and run the same tests.
  sdist-install:
    needs: sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The archive has no rust-toolchain.toml, so name the pinned toolchain.
      - name: Install the pinned Rust toolchain
        id: rust
        run: |
          channel=$(python3 -I -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["toolchain"]["channel"])' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          echo "toolchain=$channel" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - name: Build and test from the sdist
        working-directory: ${{ runner.temp }}
        env:
          DIST: ${{ github.workspace }}/dist
          TESTS: ${{ github.workspace }}/crates/python/tests
          RUSTUP_TOOLCHAIN: ${{ steps.rust.outputs.toolchain }}
        run: |
          uv venv --python 3.11 --managed-python venv
          uv pip install --python venv --no-binary covalence "$DIST"/*.tar.gz
          venv/bin/python -I -m unittest discover -v -s "$TESTS"
          PY=venv/bin/python; "$PY" -I -c 'import importlib.resources as r; assert r.files("covalence").joinpath("THIRD-PARTY-LICENSES.md").is_file(), "THIRD-PARTY-LICENSES.md missing"'

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/python-v')
    needs: [wheel, sdist, sdist-install]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false
      # Only the distributions: the wheels and the sdist, not the license
      # notices the build jobs already packed into them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false
      # The tag carries the workspace's Cargo version (0.1.0-dev.2); file names
      # carry its PEP 440 form (0.1.0.dev2), as maturin writes it.
      - name: Check the tag and files against the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo_version="$(python3 -I -c \
            'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["workspace"]["package"]["version"])' \
            Cargo.toml)"
          tag="${TAG#python-}"
          if [ "${tag#v}" != "$cargo_version" ]; then
            echo "::error::tag $TAG does not match the workspace version $cargo_version"
            exit 1
          fi
          version="$(uv run --no-project --with packaging==26.3 python -I -c \
            'import sys; from packaging.version import Version; print(Version(sys.argv[1]))' \
            "$cargo_version")"
          for file in dist/*; do
            case "$(basename "$file")" in
              "covalence-$version-"*.whl | "covalence-$version.tar.gz") ;;
              *) echo "::error::$file does not match tag $TAG"; exit 1 ;;
            esac
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "covalence $VERSION (Python)" --notes "Python wheels and sdist for covalence $VERSION."
          fi

  # Only hiloopai/covalence publishes; forks and other copies build the same
  # files but never upload them.
  # PyPI authenticates the upload by trusted publishing.
  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'hiloopai/covalence'
    needs: [wheel, sdist, sdist-install, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/covalence/
    permissions:
      id-token: write
    steps:
      # Only the distributions: the wheels and the sdist, not the license
      # notices the build jobs already packed into them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
