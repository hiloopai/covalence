name: Release kernel checker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'hiloopai/covalence' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-kernel-checker.yml
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-checker-linux
          path: dist
      - name: Publish the tested revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "kernel-checker-$GITHUB_SHA" --target "$GITHUB_SHA" \
            --title "Kernel checker $GITHUB_SHA" --prerelease \
            --notes 'Linux x86-64 binary. Consumers must pin the revision and archive SHA-256.' \
            dist/cov-kernel-checker-x86_64-unknown-linux-gnu.tar.gz dist/SHA256SUMS
