name: Lake cache

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Lake's download protocol changed between these supported nightlies.
      matrix:
        lean:
          - nightly: nightly-2026-10-30
            sha256: 4cdb35bfebccab607403d642081b12fa01c9b2e79b9f9ab323f95803e9b8abc8
            package: true
          - nightly: nightly-2026-11-05
            sha256: 7726902321b0ea4c237397d1e7d4bb10172ed9d273bb713e89b5e544699db56f
            package: false
    env:
      LAKE_TEST_TOOLCHAIN: leanprover/lean4:${{ matrix.lean.nightly }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install the tested Lean release
        shell: bash
        env:
          NIGHTLY: ${{ matrix.lean.nightly }}
          SHA256: ${{ matrix.lean.sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/leanprover/lean4-nightly/releases/download/$NIGHTLY/lean-4.37.0-$NIGHTLY-linux.tar.zst" \
            --output lean.tar.zst
          echo "$SHA256  lean.tar.zst" | sha256sum --check
          mkdir lean
          tar --zstd -xf lean.tar.zst --strip-components=1 -C lean
          echo "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"
      # Thomas owns these pins until Lean ships the scalar-array, NUL-string,
      # and explicit-stack fixes (leangz#12, #15, and #22).
      - name: Prepare the pinned archive codec
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/lake-archiver"
          cd "$RUNNER_TEMP/lake-archiver"
          git fetch --depth 16 https://github.com/digama0/leangz.git \
            33570f263222fe8aa4e071f4a30b1b69bfc0f4e3 \
            b15180b547e17bda933b7c7706db1a1ca611fcc8
          git checkout --detach 33570f263222fe8aa4e071f4a30b1b69bfc0f4e3
          # PR #22 is not merged upstream and predates the NUL-string fix.
          git -c user.name=build -c user.email=build@example.invalid merge --no-commit --no-ff \
            b15180b547e17bda933b7c7706db1a1ca611fcc8
          test "$(git write-tree)" = df689da9d52269452b562ef19b25bdcb7de7b47d
      - name: Build and test the pinned archive codec
        run: |
          cargo test --locked --manifest-path "$RUNNER_TEMP/lake-archiver/Cargo.toml"
          cargo build --locked --release --manifest-path "$RUNNER_TEMP/lake-archiver/Cargo.toml" --bin leantar
          install -m 755 "$RUNNER_TEMP/lake-archiver/target/release/leantar" "$RUNNER_TEMP/lean/bin/leantar"
      # The Lake overlays sit beside the binary the tests run, as in the archive,
      # so every test installs this toolchain's overlay and runs its Lake.
      - name: Unpack the pinned Lake overlays
        shell: bash
        run: |
          set -euo pipefail
          grep -v '^#' crates/lean/cache/lake-overlays | while read -r githash url sha256; do
            curl --fail --location --silent --show-error --retry 3 "$url" --output "$RUNNER_TEMP/overlay.tar.zst"
            echo "$sha256  $RUNNER_TEMP/overlay.tar.zst" | sha256sum --check
            mkdir -p "target/release/lake-overlay/$githash"
            tar --zstd -xf "$RUNNER_TEMP/overlay.tar.zst" -C "target/release/lake-overlay/$githash"
          done
          test -d "target/release/lake-overlay/$(lean --githash)"
      - name: Check and test the native Lake protocol
        run: |
          cargo clippy --locked -p covalence-lean-cache --all-targets --features lake-tests -- -D warnings
          cargo test --locked --release -p covalence-lean-cache --features lake-tests
      - name: Check that the tests ran the overlay's Lake
        shell: bash
        run: |
          set -euo pipefail
          cd "target/release/lake-overlay/$(lean --githash)"
          find . -type f -print0 | while IFS= read -r -d '' file; do
            cmp "$file" "$RUNNER_TEMP/lean/$file"
          done
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        if: matrix.lean.package
        with:
          tool: cargo-about@0.9.0
      - name: Package the tested binary and licenses
        if: matrix.lean.package
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          cargo about generate --locked --manifest-path crates/lean/cache/Cargo.toml \
            -c crates/python/about.toml -o dist/THIRD-PARTY-LICENSES.md \
            crates/lean/cache/licenses.md.hbs
          cargo about generate --locked --manifest-path "$RUNNER_TEMP/lake-archiver/Cargo.toml" \
            -c crates/python/about.toml -o dist/LEANTAR-THIRD-PARTY-LICENSES.md \
            crates/lean/cache/licenses.md.hbs
          cp target/release/cov-lake-cache LICENSE-* dist/
          cp -a target/release/lake-overlay dist/
          cp crates/lean/cache/lake-overlays dist/LAKE-OVERLAYS
          cp "$RUNNER_TEMP/lean/LICENSE" dist/LAKE-OVERLAY-LICENSE
          cp "$RUNNER_TEMP/lake-archiver/target/release/leantar" dist/
          cp "$RUNNER_TEMP/lake-archiver/LICENSE" dist/LEANTAR-LICENSE
          git -C "$RUNNER_TEMP/lake-archiver" rev-parse HEAD MERGE_HEAD > dist/LEANTAR-REVISIONS
          git -C "$RUNNER_TEMP/lake-archiver" write-tree > dist/LEANTAR-TREE
          strip dist/cov-lake-cache dist/leantar
          cd dist
          tar -czf cov-lake-cache-x86_64-unknown-linux-gnu.tar.gz cov-lake-cache leantar \
            lake-overlay LICENSE-* THIRD-PARTY-LICENSES.md LEANTAR-* LAKE-OVERLAY*
          sha256sum cov-lake-cache-x86_64-unknown-linux-gnu.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.lean.package
        with:
          name: lake-cache-linux
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
