[workspace]
members = ["crates/lib/error", "crates/lib/cli", "tools/glu", "crates/lib/serde", "crates/lib/data", "crates/lib/python", "crates/python", "crates/lib/cid", "crates/lib/sqlite", "crates/lib/dasl", "crates/cas/trait", "crates/cas/memory", "crates/lib/rand", "crates/cas/sqlite", "crates/kv/trait", "crates/kv/memory", "crates/kv/s3", "crates/cas/kv", "crates/blob/trait"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev.5"
edition = "2024"
rust-version = "1.98"
license = "CC0-1.0 OR MIT OR Apache-2.0"
repository = "https://github.com/hiloopai/covalence"
publish = false

[workspace.dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
miette = "7.6.0"
sha2 = "0.11.0"
snafu = "0.9.2"
# Published crates, at the workspace version so the set moves together.
covalence-blob-trait = { path = "crates/blob/trait", version = "=0.1.0-dev.5" }
covalence-cas-kv = { path = "crates/cas/kv", version = "=0.1.0-dev.5" }
covalence-cas-memory = { path = "crates/cas/memory", version = "=0.1.0-dev.5" }
covalence-cas-sqlite = { path = "crates/cas/sqlite", version = "=0.1.0-dev.5" }
covalence-cas-trait = { path = "crates/cas/trait", version = "=0.1.0-dev.5" }
covalence-kv-memory = { path = "crates/kv/memory", version = "=0.1.0-dev.5" }
covalence-kv-s3 = { path = "crates/kv/s3", version = "=0.1.0-dev.5" }
covalence-kv-trait = { path = "crates/kv/trait", version = "=0.1.0-dev.5" }
covalence-lib-cid = { path = "crates/lib/cid", version = "=0.1.0-dev.5" }
covalence-lib-cli = { path = "crates/lib/cli", version = "=0.1.0-dev.5" }
covalence-lib-dasl = { path = "crates/lib/dasl", version = "=0.1.0-dev.5" }
covalence-lib-data = { path = "crates/lib/data", version = "=0.1.0-dev.5" }
covalence-lib-error = { path = "crates/lib/error", version = "=0.1.0-dev.5" }
covalence-lib-rand = { path = "crates/lib/rand", version = "=0.1.0-dev.5" }
covalence-lib-serde = { path = "crates/lib/serde", version = "=0.1.0-dev.5" }
covalence-lib-sqlite = { path = "crates/lib/sqlite", version = "=0.1.0-dev.5" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
